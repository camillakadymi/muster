<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muster — Pattern Instrument</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">muster</span>
      <span class="brand-sub">pattern instrument</span>
    </div>
    <div class="group">
      <button class="btn" id="btn-new" title="New empty canvas with default size and palette">New</button>
      <button class="btn danger" id="btn-clear" title="Remove every shape — keeps canvas size, background and palette">Clear everything</button>
      <button class="btn" id="btn-open">Open</button>
      <button class="btn" id="btn-save">Save</button>
      <input type="file" id="file-open" accept=".json,application/json" hidden>
    </div>
    <div class="group">
      <button class="btn icon" id="btn-undo" title="Undo (⌘Z)">↶</button>
      <button class="btn icon" id="btn-redo" title="Redo (⇧⌘Z)">↷</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="btn" id="btn-svg" title="Vector only — glow, halo and grain are left out">Export SVG</button>
      <div class="export-png">
        <select id="png-scale" title="PNG resolution">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
        <button class="btn primary" id="btn-png">Export PNG</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <nav class="tools" id="tools"></nav>

    <section class="stage">
      <div class="stage-inner" id="stage">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <g id="content"></g>
          <g id="overlay"></g>
        </svg>
      </div>
      <div class="stage-foot">
        <span class="mono" id="doc-size"></span>
        <span class="hint" id="hint"></span>
        <div class="zoom">
          <button class="btn icon small" id="zoom-out" title="Zoom out">−</button>
          <button class="btn small mono" id="zoom-label" title="Fit to screen">100%</button>
          <button class="btn icon small" id="zoom-in" title="Zoom in">+</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button data-tab="doc">Document</button>
        <button data-tab="shape">Shape</button>
      </div>
      <div class="panel-body" id="panel"></div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
